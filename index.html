<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NomadGirl">
<title>NomadGirl</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('nomad.theme') || 'gray'; } catch (e) { document.documentElement.dataset.theme = 'gray'; }</script>
<link rel="stylesheet" href="game/ui.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ui-bg); color: var(--ui-text); font-family: var(--ui-font); }
  main { width: min(560px, 92vw); padding: 32px 0; }
  .hero { display: flex; align-items: flex-end; gap: 18px; }
  .leyla { flex: none; width: 88px; height: 216px; background: url(projects/nomadgirl/assets/leyla/idle.png) 0 0 / 704px 216px no-repeat; animation: idle 1.2s steps(8) infinite; }
  @keyframes idle { to { background-position: -704px 0; } }
  @media (prefers-reduced-motion: reduce) { .leyla { animation: none; } }
  h1 { font-family: var(--ui-pixel); font-weight: normal; font-size: 64px; margin: 0; letter-spacing: 1px; }
  .sub { color: var(--ui-text2); margin: 4px 0 28px; line-height: 1.5; }
  nav { display: grid; gap: 10px; }
  a, .soon { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--ui-r-pane); border: 1px solid var(--ui-border); background: var(--ui-panel); color: var(--ui-text); text-decoration: none; }
  a:hover { border-color: var(--ui-acc-line); }
  a.main { background: var(--ui-acc-soft); border-color: var(--ui-acc-line); }
  b { display: block; font-weight: 600; }
  small { color: var(--ui-text3); }
  .soon { opacity: .5; }
  .ic { flex: none; }
  footer { margin-top: 28px; font-size: 12px; color: var(--ui-text3); }
  footer a { display: inline; padding: 0; border: 0; background: none; color: var(--ui-text2); text-decoration: underline; }
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="leyla" role="img" aria-label="Leyla"></div>
    <div>
      <h1>NomadGirl</h1>
      <p class="sub">Leyla lebt in den Wastelands rund um BigCityDelta in ihrem Rig. Sie plündert, was andere liegen lassen, und kocht erstaunlich gut.</p>
    </div>
  </div>
  <nav id="nav"></nav>
  <footer>GPL v3 oder später · <a href="https://github.com/dna20717/NomadGirl">Quelltext auf GitHub</a></footer>
</main>
<script type="module">
  import { icon } from './game/icons.js';
  const nav = document.getElementById('nav');
  const entry = (href, ic, title, text, cls = '') => {
    const e = document.createElement(href ? 'a' : 'div');
    if (href) e.href = href;
    e.className = cls || (href ? '' : 'soon');
    e.append(icon(ic, 26));
    const t = document.createElement('span');
    t.innerHTML = `<b>${title}</b><small>${text}</small>`;
    e.append(t);
    nav.append(e);
  };
  entry('workshop.html', 'workbench', 'Werkstatt', 'Alle Aspekte des Spiels einstellen: Leyla, Waffen, Rezepte, Rig, Welt', 'main');
  entry('https://github.com/dna20717/NomadGirl/blob/main/docs/design.md', 'data', 'Design-Dokument', 'Pitch, Core Loop, Mechaniken, Fahrplan');
  entry(null, 'play', 'Spiel', 'Kommt mit dem MVP „Movement & Kampf“');
</script>
</body>
</html>
