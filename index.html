<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="game/brand/icon.svg">
<link rel="apple-touch-icon" href="game/brand/icon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomadGirl</title>
<script>if (new URLSearchParams(location.search).has('preview')) document.documentElement.classList.add('preview');   // #125 workshop preview: no hint line
try { document.documentElement.dataset.theme = localStorage.getItem('nomad.theme') || 'gray'; } catch (e) { document.documentElement.dataset.theme = 'gray'; }</script>
<link rel="stylesheet" href="game/ui.css">
<style>
  .preview .hint { display: none; }
  /* Startseite (online unter /): #123/#124 das Hauptmenü aus dem Van-Cockpit (Daniel 20.11.2026: „Bring es auf Prod“; die alte Startseite liegt unter /classic). Szene = Startseite im Fahrmodus, Cockpit aus PixelLab-Teilen
     (game/splash/cockpit.js, Startseite › Cockpit), Billboard mit der Werbung, AvA fliegt vor dem Van. */
  html, body { height: 100%; margin: 0; overflow: hidden; background: #141013; }
  #scene, #cockpit { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #cockpit { object-fit: cover; pointer-events: none; z-index: 2; }
  h1.logo { position: fixed; left: -6000px; top: 0; margin: 0; line-height: 0; width: 760px; }   /* the animated logo runs off-screen and is painted onto the billboard */
  #lcd { position: fixed; z-index: 3; box-sizing: border-box; overflow: hidden; font-family: VT323, monospace; color: #9cdb43; text-shadow: 0 0 6px rgba(156,219,67,.55); display: grid; align-content: start; }
  #lcd .hd { display: flex; justify-content: space-between; color: #59c135; white-space: nowrap; overflow: hidden; font-size: .72em; gap: .8em; }
  #lcd .hd #np { flex: 1; overflow: hidden; } #lcd .hd #np i { display: inline-block; font-style: normal; padding-left: 100%; animation: np-run 11s linear infinite; }
  @keyframes np-run { to { transform: translateX(-100%); } }
  #lcd a { display: flex; justify-content: space-between; align-items: baseline; color: inherit; text-decoration: none; padding: 0 .3em; white-space: nowrap; cursor: pointer; }
  #lcd a[hidden] { display: none; }
  #lcd a.danger { color: #ff6b6b; text-shadow: 0 0 6px rgba(255,80,80,.5); } #lcd a.danger.on { background: #ff6b6b; color: #1a0b0b; }
  #lcd a.q { pointer-events: none; color: #ffd541; } #lcd a.q.on { background: none; color: #ffd541; }
  #lcd input.name { font: inherit; color: inherit; background: rgba(156,219,67,.12); border: 0; border-bottom: 1px solid currentColor; width: 70%; outline: none; padding: 0; }
  #slotshot { position: fixed; z-index: 3; margin: 0; padding: 6px; background: rgba(8,10,8,.86); border: 2px solid #59c135; border-radius: 6px; box-shadow: 0 0 18px rgba(89,193,53,.35); font-family: VT323, monospace; color: #9cdb43; }
  #slotshot img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; image-rendering: auto; border-radius: 3px; }
  #slotshot figcaption { display: flex; flex-direction: column; padding-top: 4px; line-height: 1.05; } #slotshot b { font-weight: normal; font-size: 1.15em; } #slotshot small { opacity: .75; }
  #slotshot[hidden] { display: none; }
  #lcd a small { opacity: .65; font-size: .7em; }
  #lcd a.on { background: #9cdb43; color: #0b1a12; text-shadow: none; }
  #lcd a.on span::before { content: '▶ '; }
  #flash { position: fixed; inset: 0; z-index: 4; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .hint { position: fixed; right: 1.5vw; bottom: 1.2vh; z-index: 3; font: 16px VT323, monospace; color: #e4d2aa; text-shadow: 0 2px 0 #060608; text-align: right; opacity: .8; }
  .hint a { color: #ffd541; }
  /* #135 (Daniel: „Das Hauptmenü sollte vollständig laden, bis es gerendert wird und nicht in Stücken“): one veil until scene, cockpit,
     stickers and fonts stand, then it fades; after 12 s it lifts anyway (stability before speed) */
  #boot { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: #0d0a12; color: #7ff6ff; font: 28px VT323, monospace; letter-spacing: 3px; transition: opacity .5s ease; }
  #boot i { opacity: .8; animation: bootPulse 1.2s ease-in-out infinite alternate; font-style: normal; }
  #boot.off { opacity: 0; pointer-events: none; }
  @keyframes bootPulse { from { opacity: .35; } to { opacity: .9; } }
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite"><i>Motor startet …</i></div>
<script>setTimeout(() => { const b = document.getElementById('boot'); if (b) { b.classList.add('off'); setTimeout(() => b.remove(), 600); } }, 12000);   // #135 whatever happens: the menu shows after 12 s</script>
<canvas id="scene" aria-label="Die Straße durch die Wastelands, gesehen aus dem Van"></canvas>
<h1 class="logo"><img src="projects/nomadgirl/assets/ui/logo/logo.png" alt="NomadGirl"></h1>
<canvas id="cockpit" aria-hidden="true"></canvas>
<figure id="slotshot" hidden><img alt=""><figcaption><b></b><small></small></figcaption></figure>
<nav id="lcd" aria-label="Hauptmenü"><div class="hd"><span>88.6 FM</span><span id="np"><i>▶ Leylas Run – BombT · Rig-Radio · A Game about finding everything by leaving all behind</i></span></div></nav>
<div id="flash"></div>
<div class="hint">← → lenken · ↑ ↓ wählen · Enter los · Esc zurück · <a href="classic.html">Klassisch</a> · <a href="?stickers=all">alle Sticker</a> · <span id="dataset" title="Datenset (Varianten der Spieldaten aus der Werkstatt)"></span> · GPL v3 · <span id="version" title="Version dieser Seite (Commit und Zeit des Builds)">…</span></div>
<script type="module">
  import { startSplash } from './game/splash/splash.js';
  import { startCockpit, achievementStickers, PW, PH } from './game/splash/cockpit.js';
  import { cockpitFor } from './game/keepsakes.js';
  const BASE = new URL('projects/nomadgirl/', location.href);
  const json = f => fetch(new URL('data/' + f, BASE), { cache: 'no-store' }).then(r => r.json()).catch(() => ({}));
  const [S, A, ACH, REC, IT, BR] = await Promise.all(['splash.json', 'assets.json', 'achievements.json', 'recipes.json', 'items.json', 'brands.json'].map(json));
  const CK = S.cockpit || {};
  const load = id => new Promise(res => { const f = A[id]?.file; if (!f) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = new URL(f, BASE).href; });
  const [bbImg, posterImg, logosImg] = await Promise.all([load(CK.billboard), load(CK.poster), load(CK.adLogos || 'map_logos')]);

  // ---------- menu in the radio ----------
  const ITEMS = [['game.html?camp', 'Spiel', 'Camp & Runs'], ['intro.html', 'Intro', 'Wie alles anfing'], ['game.html', 'Testraum', 'Parkour'], ['workshop.html', 'Werkstatt', 'Alles einstellen'], ['feedback.html', 'Feedback', 'Testphase: Meldungen & Abnahme'], ['https://github.com/dna20717/NomadGirl/blob/main/docs/design.md', 'Design-Dok', 'Fahrplan']];
  const lcd = document.getElementById('lcd'), shotEl = document.getElementById('slotshot');
  const row = (t, s2, act, cls = '') => { const a = document.createElement('a'); a.href = '#'; a.innerHTML = `<span></span><small></small>`; a.querySelector('span').textContent = t; a.querySelector('small').textContent = s2 || ''; if (cls) a.className = cls; a.addEventListener('click', e => { e.preventDefault(); act?.(); }); return a; };
  // the LCD has levels (#126): the main menu, the slots, a slot's actions, dialogs; ← Esc / B goes back
  let links = [], sel = 0, levels = [];
  const VIS = 4;
  const show = () => { const top = Math.max(0, Math.min(links.length - VIS, sel - 1)); links.forEach((a, i) => { a.classList.toggle('on', i === sel); a.hidden = i < top || i >= top + VIS; }); links[sel]?.dispatchEvent(new Event('focusrow')); };
  const render = () => {
    const L = levels.at(-1);
    for (const a of links) a.remove();
    links = L.rows; for (const a of links) { lcd.append(a); a.addEventListener('mouseenter', () => { sel = links.indexOf(a); show(); }); }
    sel = Math.min(L.sel ?? 0, links.length - 1); show();
    if (!L.shot) shotEl.hidden = true;
  };
  const open = (rows, o = {}) => { if (levels.length) levels.at(-1).sel = sel; levels.push({ rows, ...o }); render(); };
  const back = () => { if (levels.length > 1) { levels.pop(); render(); } };
  const mainRows = ITEMS.map(([href, t, s2]) => href === 'game.html?camp' ? row(t, s2, () => slotMenu()) : (() => { const a = row(t, s2, () => { location.href = href; }); a.href = href; return a; })());
  const dsLink = document.createElement('a'); dsLink.href = '#'; dsLink.className = 'dataset'; dsLink.innerHTML = '<span>Datenset</span><small>Standard</small>'; mainRows.push(dsLink);
  (async () => {
    const { listSets, activeSetId, chooseSet } = await import('./engine/sets.js');
    const { cloudFiles } = await import('./game/cloud_store.js');
    const cloud = await cloudFiles().catch(() => null);
    let sets = cloud?.files?.has('sets/index.json') ? cloud.files.get('sets/index.json') : await listSets({ json: async p => { const r = await fetch('projects/nomadgirl/' + p, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); } }).catch(() => []);
    sets = [{ id: '', name: 'Standard' }, ...(Array.isArray(sets) ? sets.filter(x => x?.id) : [])];
    const bar = document.getElementById('dataset');
    const showSet = () => { const id = activeSetId(), x = sets.find(q => q.id === id) || sets[0]; dsLink.querySelector('small').textContent = x.name; bar.textContent = `Datenset: ${x.name}`; window.dataSets = { active: x.id, sets: sets.map(q => q.id) }; };
    dsLink.addEventListener('click', e => { e.preventDefault(); const i = sets.findIndex(q => q.id === activeSetId()); chooseSet(sets[(i + 1) % sets.length].id); showSet(); });
    showSet();
  })().catch(e => console.warn('Datensets:', e));
  import('./game/version.js').then(({ loadVersion }) => loadVersion()).then(v => { const e = document.getElementById('version'); e.textContent = v.text; if (v.commit) e.title += ': ' + v.commit; window.version = v; }).catch(() => {});
  open(mainRows);

  // ---------- Spielstände (#126, docs/concepts/save_slots.md): three slots, Vor-Lösch-Zustand, preview, controller ----------
  const SL = await import('./game/slots.js');
  const store = await SL.openStorage().catch(() => SL.localStorageBackend());
  const go = (n, extra = '') => { SL.chooseSlot(n); location.href = `game.html?camp&slot=${n}${extra}`; };
  const shots = {};
  const showShot = async (n, meta) => {
    shotEl.hidden = !meta; if (!meta) return;
    if (!(n in shots)) shots[n] = await store.blob(`shot${n}`).catch(() => null);
    shotEl.querySelector('img').src = shots[n] || ''; shotEl.querySelector('img').hidden = !shots[n];
    shotEl.querySelector('b').textContent = meta.name || `Leyla ${n}`; shotEl.querySelector('small').textContent = SL.metaLine(meta) + (meta.set ? ` · Datenset ${meta.set}` : '');
  };
  const confirm = (question, yes, act) => open([row(question, '', null, 'q'), row(yes, 'A / Enter', act, 'danger'), row('Nein', 'zurück', back)], { sel: 2 });
  async function slotMenu() {
    const L = await store.list().catch(() => ({})), trash = await SL.trashInfo(store).catch(() => null), active = SL.activeSlot();
    const rows = [1, 2, 3].map(n => { const m = L[n], a = row(`${n} · ${m ? m.name || 'Leyla ' + n : 'Leer'}${n === active && m ? ' ◂' : ''}`, m ? SL.metaLine(m) : 'Neues Spiel', () => m ? slotActions(n, m) : go(n, '&new'));
      a.addEventListener('focusrow', () => showShot(n, m)); return a; });
    if (trash) rows.push(row(`↺ ${trash.meta?.name || 'Spielstand'}`, `zuletzt ${trash.why}`, () => restoreMenu(trash, L)));
    rows.push(row('‹ Zurück', '', back));
    open(rows, { shot: true, sel: Math.max(0, active - 1) });
  }
  function slotActions(n, m) {
    const others = [1, 2, 3].filter(k => k !== n);
    open([row('Weiter', `${m.name} · ${SL.metaLine(m)}`, () => go(n)),
      row('Umbenennen', m.name, () => renameMenu(n, m)),
      row('Kopieren nach …', 'in einen anderen Slot', () => open([...others.map(k => row(`Slot ${k}`, '', async () => {
        const L = await store.list(); const doIt = async () => { await SL.copySlot(store, n, k); levels.length = 1; await slotMenu(); };
        if (L[k]) confirm(`Slot ${k} überschreiben?`, 'Ja, überschreiben', doIt); else doIt(); })), row('‹ Zurück', '', back)])),
      row('Neues Spiel hier', 'der alte Stand bleibt zurückholbar', () => confirm(`Slot ${n} neu beginnen?`, 'Ja, neu beginnen', () => go(n, '&new'))),
      row('Löschen', 'bleibt bis zum nächsten Löschen zurückholbar', () => confirm(`${m.name} löschen?`, 'Ja, löschen', async () => { await SL.deleteSlot(store, n); delete shots[n]; levels.length = 1; await slotMenu(); }), 'danger'),
      row('‹ Zurück', '', back)]);
  }
  function renameMenu(n, m) {
    const done = async name => { await SL.renameSlot(store, n, name); levels.length = 1; await slotMenu(); };
    const input = document.createElement('input'); input.value = m.name || ''; input.maxLength = 24; input.className = 'name';
    const typed = row('', '', () => input.focus()); typed.querySelector('span').replaceWith(input); typed.querySelector('small').textContent = 'Enter';
    input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') done(input.value); if (e.key === 'Escape') back(); });
    open([typed, ...SL.NAMES.map(t => row(t, '', () => done(t))), row('‹ Zurück', '', back)]);
    if (!navigator.getGamepads?.()?.some?.(g => g?.connected)) setTimeout(() => input.focus(), 0);
  }
  function restoreMenu(trash, L) {
    open([...[1, 2, 3].map(k => row(`Nach Slot ${k}`, L[k] ? `tauscht mit ${L[k].name}` : 'frei', async () => {
      const doIt = async () => { await SL.restoreTrash(store, k); delete shots[k]; levels.length = 1; await slotMenu(); };
      if (L[k]) confirm(`Mit ${L[k].name} tauschen?`, 'Ja, tauschen', doIt); else doIt(); })), row('‹ Zurück', '', back)]);
  }

  // ---------- the road: our own texture, US two-lane highway, we drive on the RIGHT lane (#124) ----------
  // ck_road is 16 m wide with the road centre at 8 m; shift −2 puts the camera at 10 m = middle of the right lane
  const ROAD = { texture: CK.road || 'ck_road', width: 16, edge: 62, shift: -2, speed: 8, specks: 0, dust: false, shadow: false, base: '#2a1530', fog: '#5e2a36', fogFrom: 10 };

  // ---------- the billboard: rusty frame (PixelLab), the ad drawn into its board each frame ----------
  // the board is 4.2 m wide (196 px); it stands left of the oncoming lane (the right side is hidden by the sun visor), we drive towards it, it rushes past, the next one comes
  const [bx0, by0] = CK.board || [22, 26], [bw0, bh0] = CK.boardSize || [196, 62], PXM = bw0 / 4.2;
  const BB = { z: 22, x: -8.5, speed: 1.3, gap: 0, screen: null };   // ~16 s from far to past
  const ad = document.createElement('canvas'); ad.width = bw0 * 2; ad.height = bh0 * 2;
  // #143 (Daniel 21.11.: Billboard-Werbung für Lore-Marken): every billboard after the first advertises a brand of the lore (logo, name in
  // its colour, slogan); every n-th one is the game's own ad again (Startseite › Cockpit › Werbung)
  const BRANDS = CK.ads === false ? [] : Object.entries(BR || {}).filter(([, b]) => b.name && b.slogan && b.icon != null).map(([id, b]) => ({ id, ...b }));
  let adCount = 0;
  const nextAd = () => { adCount++; const every = Math.max(1, CK.adEvery ?? 3); BB.brand = !BRANDS.length || adCount % every === 0 ? null : BRANDS[Math.floor(Math.random() * BRANDS.length)]; };
  const drawBrandAd = (b, t) => {
    const g = ad.getContext('2d'), W = ad.width, H = ad.height; g.imageSmoothingEnabled = false;
    const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#0d0a12'); bg.addColorStop(1, b.color || '#3b1725'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.globalAlpha = 0.12; g.fillStyle = '#fef3c0'; for (let x = -H; x < W; x += 18) { g.beginPath(); g.moveTo(x, H); g.lineTo(x + H, 0); g.lineTo(x + H + 6, 0); g.lineTo(x + 6, H); g.fill(); } g.globalAlpha = 1;   // sun rays of an old print
    const L = A[CK.adLogos || 'map_logos'] || {}, [cw, ch] = L.cell || [64, 64], cols = (L.grid || [4])[0];
    const sz = H * 0.78, lx = W * 0.05, ly = (H - 22 - sz) / 2 + 2;
    if (logosImg) { g.fillStyle = 'rgba(6,6,8,.55)'; g.beginPath(); g.arc(lx + sz / 2, ly + sz / 2 + 3, sz * 0.52, 0, Math.PI * 2); g.fill(); g.drawImage(logosImg, (b.icon % cols) * cw, Math.floor(b.icon / cols) * ch, cw, ch, lx, ly, sz, sz); }
    const tx = lx + sz + W * 0.04, tw = W - tx - W * 0.04;
    let fs = 40; g.font = `${fs}px VT323, monospace`; while (g.measureText(b.name).width > tw && fs > 18) g.font = `${--fs}px VT323, monospace`;
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = '#060608'; g.fillText(b.name, tx + 3, H * 0.42 + 3); g.fillStyle = b.color || '#fa6a0a'; for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) g.fillText(b.name, tx + dx * 2, H * 0.42 + dy * 2); g.fillStyle = '#fef3c0'; g.fillText(b.name, tx, H * 0.42);   // cream letters with a rim in the brand's colour: readable on every background
    g.font = '20px VT323, monospace'; g.fillStyle = '#fef3c0'; g.fillText(b.slogan, tx, H * 0.42 + 24);
    g.fillStyle = 'rgba(6,6,8,.82)'; g.fillRect(0, H - 22, W, 22); g.fillStyle = b.color || '#fa6a0a'; g.fillRect(0, H - 23, W, 2);
    g.font = '15px VT323, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#ffd541';
    g.fillText(b.parent && BR[b.parent] ? `${b.name.toUpperCase()} · A ${BR[b.parent].name.toUpperCase()} COMPANY` : (b.ad || 'AVAILABLE ALL OVER THE DELTA'), W / 2, H - 11);
    if (bbImg) { g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.35; g.drawImage(bbImg, bx0, by0, bw0, bh0, 0, 0, W, H); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; }
  };
  const drawAd = t => {   // a real advertisement: key art, the logo, the tagline, a badge; then the board's own grime over it
    const g = ad.getContext('2d'), W = ad.width, H = ad.height; g.imageSmoothingEnabled = false;
    g.fillStyle = '#3b1725'; g.fillRect(0, 0, W, H);
    if (posterImg) { const k = W / posterImg.width; g.save(); g.translate(W, 0); g.scale(-1, 1); g.drawImage(posterImg, 0, H - posterImg.height * k + 6, W, posterImg.height * k); g.restore(); }   // mirrored: Leyla and the van on the right
    const shade = g.createLinearGradient(0, 0, W * 0.75, 0); shade.addColorStop(0, 'rgba(20,16,19,.75)'); shade.addColorStop(1, 'rgba(20,16,19,0)'); g.fillStyle = shade; g.fillRect(0, 0, W, H - 22);
    const logo = document.querySelector('h1.logo canvas');
    if (logo) {   // Daniel: „mit einer Outline in einer Kontrastfarbe besser lesbar“: a cream outline round the dark asphalt letters
      const k = W * 0.78 / logo.width, lw = logo.width * k, lh = logo.height * k, lx = -W * 0.015, ly = -H * 0.22;
      if (!drawAd.sil || drawAd.sil.width !== Math.ceil(lw)) { drawAd.sil = Object.assign(document.createElement('canvas'), { width: Math.ceil(lw), height: Math.ceil(lh) }); }
      const sc = drawAd.sil.getContext('2d'); sc.globalCompositeOperation = 'source-over'; sc.clearRect(0, 0, lw, lh); sc.drawImage(logo, 0, 0, lw, lh);
      const ring = (col, r) => { sc.globalCompositeOperation = 'source-in'; sc.fillStyle = col; sc.fillRect(0, 0, lw, lh);
        for (let a = 0; a < 16; a++) g.drawImage(drawAd.sil, lx + Math.round(Math.cos(a / 8 * Math.PI) * r), ly + Math.round(Math.sin(a / 8 * Math.PI) * r)); };
      ring('#060608', 6); ring('#fef3c0', 4);   // dark rim outside, cream outline inside
      g.drawImage(logo, lx, ly, lw, lh);
    }
    g.fillStyle = 'rgba(6,6,8,.82)'; g.fillRect(0, H - 22, W, 22); g.fillStyle = '#fa6a0a'; g.fillRect(0, H - 23, W, 2);
    g.font = '18px VT323, monospace'; g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillStyle = '#ffd541';
    g.fillText(CK.tagline || '', W / 2, H - 11);
    g.save(); g.translate(W * 0.6, 26); g.rotate(0.18 + Math.sin(t * 2) * 0.02);   // badge
    g.fillStyle = '#df3e23'; g.beginPath(); for (let i = 0; i < 24; i++) { const r = i % 2 ? 17 : 21, a = i / 24 * Math.PI * 2; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.fill();
    g.fillStyle = '#fef3c0'; g.font = '11px VT323, monospace'; g.fillText('NOW ON', 0, -5); g.fillText('THE ROAD', 0, 6); g.restore();
    if (bbImg) { g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.35; g.drawImage(bbImg, bx0, by0, bw0, bh0, 0, 0, W, H); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; }   // rust and seams of the board
  };
  const billboard = ({ ctx, project, scale, dt, t, Z_FAR }) => {
    if (BB.gap > 0) { BB.gap -= dt; if (BB.gap <= 0) { BB.z = 38; nextAd(); } BB.screen = null; return; }
    BB.z -= BB.speed * dt;
    if (BB.z < 2.5) { BB.gap = 3; BB.screen = null; return; }
    if (!bbImg) return;
    const k = scale(BB.z) / PXM, [gx, gy] = project(BB.x, BB.z), w = bbImg.width * k, h = bbImg.height * k, x = gx - w / 2, y = gy - h;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, (Z_FAR * 0.95 - BB.z) / 6)); ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = 'rgba(6,6,8,.3)'; ctx.beginPath(); ctx.ellipse(gx, gy, w * 0.4, Math.max(2, h * 0.03), 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(bbImg, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    if (BB.brand) drawBrandAd(BB.brand, t); else drawAd(t); ctx.drawImage(ad, Math.round(x + bx0 * k), Math.round(y + by0 * k), Math.round(bw0 * k), Math.round(bh0 * k));
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= 0.16 + (Math.sin(t * 13) > 0.96 ? -0.1 : 0);   // the three lamps light the board
    const lg = ctx.createLinearGradient(0, y + by0 * k, 0, y + (by0 + bh0) * k); lg.addColorStop(0, '#fef3c0'); lg.addColorStop(1, 'rgba(254,243,192,0)');
    ctx.fillStyle = lg; ctx.fillRect(x + bx0 * k, y + by0 * k, bw0 * k, bh0 * k);
    ctx.restore();
    BB.screen = { x: gx, y: y + (by0 + bh0 / 2) * k, w: bw0 * k, z: BB.z };
  };

  // ---------- AvA flies ahead of the van: cruises, scans, photographs the billboard, rolls, peeks in, races ahead, naps, hunts a bug ----------
  const flash = document.getElementById('flash'), scr = document.getElementById('scene');
  let cockpit = null;
  const ava = { x: 0.55, y: 0.3, s: 1, rot: 0, act: null, until: 0, t0: 0, did: false, scan: 0 };
  const ACTS = {
    cruise: { ms: [5000, 8000], go: (q, t) => ({ x: 0.5 + Math.sin(t * 0.5) * 0.14, y: 0.27 + Math.sin(t * 0.8) * 0.02, s: 1 }) },
    scan: { ms: [4500, 6000], mood: 'scan', go: (q, t) => ({ x: 0.42 + Math.sin(t * 0.3) * 0.05, y: 0.29, s: 0.95, scan: 1 }) },
    billboard: { ms: [5000, 5000], mood: 'curious', ok: () => BB.screen && BB.screen.z < 24 && BB.screen.z > 9, go: (q, t, p) => {
      const S = BB.screen; if (!S) return { x: 0.6, y: 0.27, s: 1 };
      if (p > 0.55 && !q.did) { q.did = true; flash.style.transition = 'none'; flash.style.opacity = 0.55; requestAnimationFrame(() => { flash.style.transition = 'opacity .5s'; flash.style.opacity = 0; }); }
      return { x: (S.x - S.w * 0.25) / scr.width, y: S.y / scr.height - 0.08, s: 0.7, bubble: p > 0.55 ? '*klick*' : undefined }; } },
    roll: { ms: [1600, 1600], mood: 'dash', go: (q, t, p) => ({ x: 0.52 + p * 0.1, y: 0.25, s: 1, rot: p * Math.PI * 2 }) },
    peek: { ms: [3800, 3800], mood: 'curious', go: (q, t, p) => {
      if (p > 0.6 && !q.did) { q.did = true; cockpit?.bump(); }
      return { x: 0.47, y: 0.37, s: 2.3, bubble: p > 0.6 ? '*tock tock*' : '(o_o)?' }; } },
    race: { ms: [4200, 4200], mood: 'dash', go: (q, t, p) => ({ x: 0.5 + Math.sin(p * Math.PI) * 0.04, y: 0.27 - Math.sin(p * Math.PI) * 0.06, s: 1 - Math.sin(p * Math.PI) * 0.65 }) },
    nap: { ms: [6000, 7000], mood: 'sleep', go: (q, t, p) => ({ x: 0.58, y: 0.31 + p * 0.03, s: 0.95, rot: Math.sin(t) * 0.1 }) },
    bug: { ms: [3500, 3500], mood: 'kill', go: (q, t, p) => ({ x: 0.5 + Math.sin(t * 7) * 0.1, y: 0.27 + Math.sin(t * 11) * 0.04, s: 1, bubble: 'BZZT!' }) },
  };
  const pick = () => {
    if (ACTS.billboard.ok() && ava.act !== 'billboard' && Math.random() < 0.7) return ['billboard', ACTS.billboard];
    const pool = Object.entries(ACTS).filter(([n, a]) => n !== ava.act && n !== 'billboard').flatMap(o => o[0] === 'cruise' || o[0] === 'scan' ? [o, o] : [o]);
    return pool[Math.floor(Math.random() * pool.length)];
  };
  const droneBrain = ({ t, now }) => {
    if (!ava.act || now > ava.until) { const [n, a] = pick(); Object.assign(ava, { act: n, t0: now, until: now + a.ms[0] + Math.random() * (a.ms[1] - a.ms[0]), did: false }); }
    const a = ACTS[ava.act], p = Math.min(1, (now - ava.t0) / (ava.until - ava.t0)), want = a.go(ava, t, p), st = splash?.curve?.() ?? 0;
    const f = ava.act === 'roll' ? 1 : 0.06;
    const wx = Math.max(0.12, Math.min(0.88, want.x - st * 0.06)), wy = Math.max(0.14, Math.min(0.46, want.y));   // she stays in the windshield
    ava.x += (wx - ava.x) * f; ava.y += (wy - ava.y) * f; ava.s += ((want.s ?? 1) - ava.s) * 0.06; ava.rot = want.rot ?? ava.rot * 0.9; ava.scan += ((want.scan ?? 0) - ava.scan) * 0.08;
    return { x: ava.x, y: ava.y, scale: ava.s, rot: ava.rot, mood: a.mood, bubble: want.bubble };
  };
  const onDrone = ({ ctx, x, y, k, W, H, t, behind }) => { if (behind) ava.screen = { x, y };   // the scan: a teal cone sweeping the road, a scanline, a readout
    if (!behind || ava.scan < 0.05) return;
    const a = ava.scan, sweep = Math.sin(t * 1.6) * W * 0.12, gx = x + sweep, gy = H * 0.5, half = W * 0.09;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.22 * a;
    const g = ctx.createLinearGradient(0, y, 0, gy); g.addColorStop(0, '#20d6c7'); g.addColorStop(1, 'rgba(32,214,199,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y + 10 * k); ctx.lineTo(gx - half, gy); ctx.lineTo(gx + half, gy); ctx.closePath(); ctx.fill();
    const f = (t * 0.9) % 1, ly = y + (gy - y) * f, cx = x + (gx - x) * f;
    ctx.globalAlpha = 0.6 * a; ctx.fillStyle = '#a6fcdb'; ctx.fillRect(Math.round(cx - half * f), Math.round(ly), Math.round(half * 2 * f), Math.max(1, Math.round(H * 0.003)));
    ctx.restore();
    ctx.globalAlpha = a; ctx.font = `${Math.round(H * 0.022)}px VT323, monospace`; ctx.fillStyle = '#a6fcdb'; ctx.textAlign = 'left';
    ctx.fillText(`SCAN ${String(Math.floor((t * 37) % 100)).padStart(2, '0')}% · ${['SCHROTT', 'WASSER?', 'NICHTS', 'KAKTUS', 'BEUTE!'][Math.floor(t / 1.3) % 5]}`, gx + half * 1.1, gy - H * 0.02); ctx.globalAlpha = 1;
  };

  // ---------- start ----------
  let splash = null;
  const bootDone = (() => { let done = false; const el = document.getElementById('boot'); const lift = () => { if (done) return; done = true; el?.classList.add('off'); setTimeout(() => el?.remove(), 600); window.bootReady = true; }; return lift; })();
  const splashReady = startSplash(document.getElementById('scene'), { drive: true, runner: false, nowPlaying: false, onGround: billboard, droneBrain, onDrone,
    data: { horizon: 44, ground: ROAD, curve: { pan: 7 } } }).then(x => { splash = x; window.splash = x; }).catch(e => console.warn('Szene', e));
  // stickers: reached achievements from the savegame (online, else this browser); ?stickers=all shows every one
  const all = new URLSearchParams(location.search).get('stickers') === 'all';
  let done = {}, counts = {};
  try { const G = await store.blob('achievements'); done = G?.done || {}; counts = G?.counts || {}; } catch { }   // #126 achievements count over all savegames
  if (all) done = Object.fromEntries(Object.keys(ACH).map(k => [k, true]));
  const stickers = await achievementStickers({ achievements: ACH, recipes: REC, items: IT, assets: A }, done, BASE);
  // the menu text follows the LCD in the cockpit's own animation frame (same offset as the pixels: leaning, potholes)
  const placeLcd = L => { const k = Math.max(innerWidth / PW, innerHeight / PH), ox = (innerWidth - PW * k) / 2, oy = (innerHeight - PH * k) / 2;
    lcd.style.cssText = `left:${ox + (L.x + 1) * k}px;top:${oy + (L.y + 1) * k}px;width:${(L.w - 2) * k}px;height:${(L.h - 2) * k}px;font-size:${Math.round(L.h * k / 5.4)}px;line-height:1.02`;
    const sw = Math.max(200, Math.min(360, L.w * k * 1.1));   // #126 the slot's preview stands above the radio
    shotEl.style.cssText = `left:${ox + (L.x + L.w / 2) * k - sw / 2}px;bottom:${innerHeight - (oy + L.y * k) + 10}px;width:${sw}px;font-size:${Math.round(sw / 15)}px`; };
  cockpit = await startCockpit(document.getElementById('cockpit'), { cfg: cockpitFor(CK, counts, all),   // #142 keepsakes after events in the game
    A, base: BASE, stickers, steerValue: () => splash?.curve?.() ?? 0, speed: () => 1, onFrame: placeLcd });
  // everything stands: the first frames are drawn behind the veil, then it lifts in one piece
  Promise.all([splashReady, document.fonts?.ready]).then(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))).then(bootDone, bootDone);

  const keys = new Set();
  addEventListener('keyup', e => keys.delete(e.key));
  addEventListener('keydown', e => {
    keys.add(e.key);
    if (e.key === 'ArrowDown' || e.key === 's') { sel = (sel + 1) % links.length; show(); e.preventDefault(); }
    if (e.key === 'ArrowUp' || e.key === 'w') { sel = (sel - 1 + links.length) % links.length; show(); e.preventDefault(); }
    if (e.key === 'Enter' || e.key === ' ') { links[sel].click(); e.preventDefault(); }
    if (e.key === 'Escape' || e.key === 'Backspace') { back(); e.preventDefault(); }
  });
  let held = 0, next = 0, wasA = true, wasB = true;
  const poll = now => {
    const g = navigator.getGamepads ? [...navigator.getGamepads()].find(p => p && p.connected) : null;
    // Daniel: „das Lenkrad könnte sich drehen“: the driver corrects all the time and follows gentle bends; arrows / stick take over
    const t = now / 1000, auto = 0.32 * Math.sin(t * 0.23) + 0.18 * Math.sin(t * 0.61 + 1) + 0.04 * Math.sin(t * 2.3);
    const steered = keys.has('ArrowLeft') || keys.has('ArrowRight') || (g && (Math.abs(g.axes[0] || 0) > 0.25 || g.buttons[14]?.pressed || g.buttons[15]?.pressed));
    if (!steered) splash?.steer?.(auto); else if (!g) splash?.steer?.(0);
    if (g) {
      const b = i => !!g.buttons[i] && (g.buttons[i].pressed || g.buttons[i].value > 0.5), ax = g.axes[0] || 0, ay = g.axes[1] || 0;
      const dir = ay < -0.5 || b(12) ? -1 : ay > 0.5 || b(13) ? 1 : 0;
      if (dir && (dir !== held || now >= next)) { sel = (sel + dir + links.length) % links.length; show(); next = now + (dir !== held ? 380 : 160); }
      held = dir;
      if (steered) splash?.steer?.(Math.abs(ax) > 0.25 ? Math.sign(ax) * Math.min(1, (Math.abs(ax) - 0.25) / 0.65) : b(14) ? -1 : b(15) ? 1 : 0);
      const a = b(0); if (a && !wasA) links[sel].click(); wasA = a;
      const bb = b(1); if (bb && !wasB) back(); wasB = bb;
    }
    requestAnimationFrame(poll);
  };
  requestAnimationFrame(poll);
  window.cockpitMenu = { selected: () => sel, items: () => links.map(a => a.textContent), level: () => levels.length, back, slots: () => store.list(), store, ava: () => ava.act, avaAt: () => ava.screen, stickers: () => stickers.length, billboard: () => BB.z, ad: () => ad.toDataURL(), brandAd: () => BB.brand?.id || null, nextAd: b => { BB.brand = b ? BRANDS.find(x => x.id === b) || null : null; BB.z = 14; BB.gap = 0; },
    lcdDrift: () => { const L = cockpit.lcd(), k = Math.max(innerWidth / PW, innerHeight / PH), ox = (innerWidth - PW * k) / 2, oy = (innerHeight - PH * k) / 2; return Math.abs(parseFloat(lcd.style.left) - (ox + (L.x + 1) * k)) + Math.abs(parseFloat(lcd.style.top) - (oy + (L.y + 1) * k)); }, bump: () => cockpit.bump() };
</script>
</body>
