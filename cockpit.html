<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomadGirl · Cockpit</title>
<link rel="stylesheet" href="game/ui.css">
<style>
  /* #123/#124 Das Hauptmenü aus dem Van-Cockpit (Daniel 20.11.2026). Szene = Startseite im Fahrmodus, Cockpit aus PixelLab-Teilen
     (game/splash/cockpit.js, Startseite › Cockpit), Billboard mit der Werbung, AvA fliegt vor dem Van. */
  html, body { height: 100%; margin: 0; overflow: hidden; background: #141013; }
  #scene, #cockpit { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #cockpit { object-fit: cover; pointer-events: none; z-index: 2; }
  h1.logo { position: fixed; left: -6000px; top: 0; margin: 0; line-height: 0; width: 760px; }   /* the animated logo runs off-screen and is painted onto the billboard */
  #lcd { position: fixed; z-index: 3; box-sizing: border-box; overflow: hidden; font-family: VT323, monospace; color: #9cdb43; text-shadow: 0 0 6px rgba(156,219,67,.55); display: grid; align-content: start; }
  #lcd .hd { display: flex; justify-content: space-between; color: #59c135; white-space: nowrap; overflow: hidden; font-size: .72em; gap: .8em; }
  #lcd .hd #np { flex: 1; overflow: hidden; } #lcd .hd #np i { display: inline-block; font-style: normal; padding-left: 100%; animation: np-run 11s linear infinite; }
  @keyframes np-run { to { transform: translateX(-100%); } }
  #lcd a { display: flex; justify-content: space-between; align-items: baseline; color: inherit; text-decoration: none; padding: 0 .3em; white-space: nowrap; cursor: pointer; }
  #lcd a[hidden] { display: none; }
  #lcd a small { opacity: .65; font-size: .7em; }
  #lcd a.on { background: #9cdb43; color: #0b1a12; text-shadow: none; }
  #lcd a.on span::before { content: '▶ '; }
  #flash { position: fixed; inset: 0; z-index: 4; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .hint { position: fixed; right: 1.5vw; bottom: 1.2vh; z-index: 3; font: 16px VT323, monospace; color: #e4d2aa; text-shadow: 0 2px 0 #060608; text-align: right; opacity: .8; }
  .hint a { color: #ffd541; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Die Straße durch die Wastelands, gesehen aus dem Van"></canvas>
<h1 class="logo"><img src="projects/nomadgirl/assets/ui/logo/logo.png" alt="NomadGirl"></h1>
<canvas id="cockpit" aria-hidden="true"></canvas>
<nav id="lcd" aria-label="Hauptmenü"><div class="hd"><span>88.6 FM</span><span id="np"><i>▶ Leylas Run – BombT · Rig-Radio · A Game about finding everything by leaving all behind</i></span></div></nav>
<div id="flash"></div>
<div class="hint">← → lenken · ↑ ↓ wählen · Enter los · <a href="index.html">alte Startseite</a> · <a href="?stickers=all">alle Sticker</a></div>
<script type="module">
  import { startSplash } from './game/splash/splash.js';
  import { startCockpit, achievementStickers, PW, PH } from './game/splash/cockpit.js';
  const BASE = new URL('projects/nomadgirl/', location.href);
  const json = f => fetch(new URL('data/' + f, BASE), { cache: 'no-store' }).then(r => r.json()).catch(() => ({}));
  const [S, A, ACH, REC, IT] = await Promise.all(['splash.json', 'assets.json', 'achievements.json', 'recipes.json', 'items.json'].map(json));
  const CK = S.cockpit || {};
  const load = id => new Promise(res => { const f = A[id]?.file; if (!f) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = new URL(f, BASE).href; });
  const [bbImg, posterImg] = await Promise.all([load(CK.billboard), load(CK.poster)]);

  // ---------- menu in the radio ----------
  const ITEMS = [['game.html?camp', 'Spiel', 'Camp & Runs'], ['intro.html', 'Intro', 'Wie alles anfing'], ['game.html', 'Testraum', 'Parkour'], ['workshop.html', 'Werkstatt', 'Alles einstellen'], ['https://github.com/dna20717/NomadGirl/blob/main/docs/design.md', 'Design-Dok', 'Fahrplan']];
  const lcd = document.getElementById('lcd');
  const links = ITEMS.map(([href, t, s]) => { const a = document.createElement('a'); a.href = href; a.innerHTML = `<span>${t}</span><small>${s}</small>`; lcd.append(a); return a; });
  let sel = 0;
  const VIS = 4, show = () => { const top = Math.max(0, Math.min(links.length - VIS, sel - 1)); links.forEach((a, i) => { a.classList.toggle('on', i === sel); a.hidden = i < top || i >= top + VIS; }); };
  links.forEach((a, i) => a.addEventListener('mouseenter', () => { sel = i; show(); }));
  show();

  // ---------- the road: our own texture, US two-lane highway, we drive on the RIGHT lane (#124) ----------
  // ck_road is 16 m wide with the road centre at 8 m; shift −2 puts the camera at 10 m = middle of the right lane
  const ROAD = { texture: CK.road || 'ck_road', width: 16, edge: 62, shift: -2, speed: 8, specks: 0, dust: false, shadow: false, base: '#2a1530', fog: '#5e2a36', fogFrom: 10 };

  // ---------- the billboard: rusty frame (PixelLab), the ad drawn into its board each frame ----------
  // the board is 4.2 m wide (196 px); it stands left of the oncoming lane (the right side is hidden by the sun visor), we drive towards it, it rushes past, the next one comes
  const [bx0, by0] = CK.board || [22, 26], [bw0, bh0] = CK.boardSize || [196, 62], PXM = bw0 / 4.2;
  const BB = { z: 22, x: -8.5, speed: 1.3, gap: 0, screen: null };   // ~16 s from far to past
  const ad = document.createElement('canvas'); ad.width = bw0 * 2; ad.height = bh0 * 2;
  const drawAd = t => {   // a real advertisement: key art, the logo, the tagline, a badge; then the board's own grime over it
    const g = ad.getContext('2d'), W = ad.width, H = ad.height; g.imageSmoothingEnabled = false;
    g.fillStyle = '#3b1725'; g.fillRect(0, 0, W, H);
    if (posterImg) { const k = W / posterImg.width; g.save(); g.translate(W, 0); g.scale(-1, 1); g.drawImage(posterImg, 0, H - posterImg.height * k + 6, W, posterImg.height * k); g.restore(); }   // mirrored: Leyla and the van on the right
    const shade = g.createLinearGradient(0, 0, W * 0.75, 0); shade.addColorStop(0, 'rgba(20,16,19,.75)'); shade.addColorStop(1, 'rgba(20,16,19,0)'); g.fillStyle = shade; g.fillRect(0, 0, W, H - 22);
    const logo = document.querySelector('h1.logo canvas');
    if (logo) { const k = W * 0.74 / logo.width; g.drawImage(logo, -W * 0.05, -H * 0.2, logo.width * k, logo.height * k); }
    g.fillStyle = 'rgba(6,6,8,.82)'; g.fillRect(0, H - 22, W, 22); g.fillStyle = '#fa6a0a'; g.fillRect(0, H - 23, W, 2);
    g.font = '18px VT323, monospace'; g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillStyle = '#ffd541';
    g.fillText(CK.tagline || '', W / 2, H - 11);
    g.save(); g.translate(W * 0.6, 26); g.rotate(0.18 + Math.sin(t * 2) * 0.02);   // badge
    g.fillStyle = '#df3e23'; g.beginPath(); for (let i = 0; i < 24; i++) { const r = i % 2 ? 17 : 21, a = i / 24 * Math.PI * 2; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.fill();
    g.fillStyle = '#fef3c0'; g.font = '11px VT323, monospace'; g.fillText('NOW ON', 0, -5); g.fillText('THE ROAD', 0, 6); g.restore();
    if (bbImg) { g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.35; g.drawImage(bbImg, bx0, by0, bw0, bh0, 0, 0, W, H); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; }   // rust and seams of the board
  };
  const billboard = ({ ctx, project, scale, dt, t, Z_FAR }) => {
    if (BB.gap > 0) { BB.gap -= dt; if (BB.gap <= 0) BB.z = 38; BB.screen = null; return; }
    BB.z -= BB.speed * dt;
    if (BB.z < 2.5) { BB.gap = 3; BB.screen = null; return; }
    if (!bbImg) return;
    const k = scale(BB.z) / PXM, [gx, gy] = project(BB.x, BB.z), w = bbImg.width * k, h = bbImg.height * k, x = gx - w / 2, y = gy - h;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, (Z_FAR * 0.95 - BB.z) / 6)); ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = 'rgba(6,6,8,.3)'; ctx.beginPath(); ctx.ellipse(gx, gy, w * 0.4, Math.max(2, h * 0.03), 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(bbImg, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    drawAd(t); ctx.drawImage(ad, Math.round(x + bx0 * k), Math.round(y + by0 * k), Math.round(bw0 * k), Math.round(bh0 * k));
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= 0.16 + (Math.sin(t * 13) > 0.96 ? -0.1 : 0);   // the three lamps light the board
    const lg = ctx.createLinearGradient(0, y + by0 * k, 0, y + (by0 + bh0) * k); lg.addColorStop(0, '#fef3c0'); lg.addColorStop(1, 'rgba(254,243,192,0)');
    ctx.fillStyle = lg; ctx.fillRect(x + bx0 * k, y + by0 * k, bw0 * k, bh0 * k);
    ctx.restore();
    BB.screen = { x: gx, y: y + (by0 + bh0 / 2) * k, w: bw0 * k, z: BB.z };
  };

  // ---------- AvA flies ahead of the van: cruises, scans, photographs the billboard, rolls, peeks in, races ahead, naps, hunts a bug ----------
  const flash = document.getElementById('flash'), scr = document.getElementById('scene');
  let cockpit = null;
  const ava = { x: 0.55, y: 0.3, s: 1, rot: 0, act: null, until: 0, t0: 0, did: false, scan: 0 };
  const ACTS = {
    cruise: { ms: [5000, 8000], go: (q, t) => ({ x: 0.5 + Math.sin(t * 0.5) * 0.14, y: 0.27 + Math.sin(t * 0.8) * 0.02, s: 1 }) },
    scan: { ms: [4500, 6000], mood: 'scan', go: (q, t) => ({ x: 0.42 + Math.sin(t * 0.3) * 0.05, y: 0.29, s: 0.95, scan: 1 }) },
    billboard: { ms: [5000, 5000], mood: 'curious', ok: () => BB.screen && BB.screen.z < 24 && BB.screen.z > 9, go: (q, t, p) => {
      const S = BB.screen; if (!S) return { x: 0.6, y: 0.27, s: 1 };
      if (p > 0.55 && !q.did) { q.did = true; flash.style.transition = 'none'; flash.style.opacity = 0.55; requestAnimationFrame(() => { flash.style.transition = 'opacity .5s'; flash.style.opacity = 0; }); }
      return { x: (S.x - S.w * 0.25) / scr.width, y: S.y / scr.height - 0.08, s: 0.7, bubble: p > 0.55 ? '*klick*' : undefined }; } },
    roll: { ms: [1600, 1600], mood: 'dash', go: (q, t, p) => ({ x: 0.52 + p * 0.1, y: 0.25, s: 1, rot: p * Math.PI * 2 }) },
    peek: { ms: [3800, 3800], mood: 'curious', go: (q, t, p) => {
      if (p > 0.6 && !q.did) { q.did = true; cockpit?.bump(); }
      return { x: 0.47, y: 0.37, s: 2.3, bubble: p > 0.6 ? '*tock tock*' : '(o_o)?' }; } },
    race: { ms: [4200, 4200], mood: 'dash', go: (q, t, p) => ({ x: 0.5 + Math.sin(p * Math.PI) * 0.04, y: 0.27 - Math.sin(p * Math.PI) * 0.06, s: 1 - Math.sin(p * Math.PI) * 0.65 }) },
    nap: { ms: [6000, 7000], mood: 'sleep', go: (q, t, p) => ({ x: 0.58, y: 0.31 + p * 0.03, s: 0.95, rot: Math.sin(t) * 0.1 }) },
    bug: { ms: [3500, 3500], mood: 'kill', go: (q, t, p) => ({ x: 0.5 + Math.sin(t * 7) * 0.1, y: 0.27 + Math.sin(t * 11) * 0.04, s: 1, bubble: 'BZZT!' }) },
  };
  const pick = () => {
    if (ACTS.billboard.ok() && ava.act !== 'billboard' && Math.random() < 0.7) return ['billboard', ACTS.billboard];
    const pool = Object.entries(ACTS).filter(([n, a]) => n !== ava.act && n !== 'billboard').flatMap(o => o[0] === 'cruise' || o[0] === 'scan' ? [o, o] : [o]);
    return pool[Math.floor(Math.random() * pool.length)];
  };
  const droneBrain = ({ t, now }) => {
    if (!ava.act || now > ava.until) { const [n, a] = pick(); Object.assign(ava, { act: n, t0: now, until: now + a.ms[0] + Math.random() * (a.ms[1] - a.ms[0]), did: false }); }
    const a = ACTS[ava.act], p = Math.min(1, (now - ava.t0) / (ava.until - ava.t0)), want = a.go(ava, t, p), st = splash?.curve?.() ?? 0;
    const f = ava.act === 'roll' ? 1 : 0.06;
    const wx = Math.max(0.12, Math.min(0.88, want.x - st * 0.06)), wy = Math.max(0.14, Math.min(0.46, want.y));   // she stays in the windshield
    ava.x += (wx - ava.x) * f; ava.y += (wy - ava.y) * f; ava.s += ((want.s ?? 1) - ava.s) * 0.06; ava.rot = want.rot ?? ava.rot * 0.9; ava.scan += ((want.scan ?? 0) - ava.scan) * 0.08;
    return { x: ava.x, y: ava.y, scale: ava.s, rot: ava.rot, mood: a.mood, bubble: want.bubble };
  };
  const onDrone = ({ ctx, x, y, k, W, H, t, behind }) => { if (behind) ava.screen = { x, y };   // the scan: a teal cone sweeping the road, a scanline, a readout
    if (!behind || ava.scan < 0.05) return;
    const a = ava.scan, sweep = Math.sin(t * 1.6) * W * 0.12, gx = x + sweep, gy = H * 0.5, half = W * 0.09;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.22 * a;
    const g = ctx.createLinearGradient(0, y, 0, gy); g.addColorStop(0, '#20d6c7'); g.addColorStop(1, 'rgba(32,214,199,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y + 10 * k); ctx.lineTo(gx - half, gy); ctx.lineTo(gx + half, gy); ctx.closePath(); ctx.fill();
    const f = (t * 0.9) % 1, ly = y + (gy - y) * f, cx = x + (gx - x) * f;
    ctx.globalAlpha = 0.6 * a; ctx.fillStyle = '#a6fcdb'; ctx.fillRect(Math.round(cx - half * f), Math.round(ly), Math.round(half * 2 * f), Math.max(1, Math.round(H * 0.003)));
    ctx.restore();
    ctx.globalAlpha = a; ctx.font = `${Math.round(H * 0.022)}px VT323, monospace`; ctx.fillStyle = '#a6fcdb'; ctx.textAlign = 'left';
    ctx.fillText(`SCAN ${String(Math.floor((t * 37) % 100)).padStart(2, '0')}% · ${['SCHROTT', 'WASSER?', 'NICHTS', 'KAKTUS', 'BEUTE!'][Math.floor(t / 1.3) % 5]}`, gx + half * 1.1, gy - H * 0.02); ctx.globalAlpha = 1;
  };

  // ---------- start ----------
  let splash = null;
  startSplash(document.getElementById('scene'), { drive: true, runner: false, nowPlaying: false, onGround: billboard, droneBrain, onDrone,
    data: { horizon: 44, ground: ROAD, curve: { pan: 7 } } }).then(x => { splash = x; window.splash = x; });
  // stickers: reached achievements from the savegame (online, else this browser); ?stickers=all shows every one
  const all = new URLSearchParams(location.search).get('stickers') === 'all';
  let done = {};
  try { const r = await fetch('/api/save', { headers: { accept: 'application/json' }, cache: 'no-store' }); if (r.ok && (r.headers.get('content-type') || '').includes('json')) done = (await r.json()).save?.achievements?.done || {}; } catch { }
  if (!Object.keys(done).length) try { done = JSON.parse(localStorage.getItem('nomadgirl-save') || 'null')?.achievements?.done || {}; } catch { }
  if (all) done = Object.fromEntries(Object.keys(ACH).map(k => [k, true]));
  const stickers = await achievementStickers({ achievements: ACH, recipes: REC, items: IT, assets: A }, done, BASE);
  cockpit = await startCockpit(document.getElementById('cockpit'), { cfg: CK, A, base: BASE, stickers, steerValue: () => splash?.curve?.() ?? 0, speed: () => 1 });

  addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 's') { sel = (sel + 1) % links.length; show(); e.preventDefault(); }
    if (e.key === 'ArrowUp' || e.key === 'w') { sel = (sel - 1 + links.length) % links.length; show(); e.preventDefault(); }
    if (e.key === 'Enter' || e.key === ' ') links[sel].click();
  });
  let held = 0, next = 0, wasA = true;
  const poll = now => {
    const g = navigator.getGamepads ? [...navigator.getGamepads()].find(p => p && p.connected) : null;
    if (g) {
      const b = i => !!g.buttons[i] && (g.buttons[i].pressed || g.buttons[i].value > 0.5), ax = g.axes[0] || 0, ay = g.axes[1] || 0;
      const dir = ay < -0.5 || b(12) ? -1 : ay > 0.5 || b(13) ? 1 : 0;
      if (dir && (dir !== held || now >= next)) { sel = (sel + dir + links.length) % links.length; show(); next = now + (dir !== held ? 380 : 160); }
      held = dir;
      splash?.steer?.(Math.abs(ax) > 0.25 ? Math.sign(ax) * Math.min(1, (Math.abs(ax) - 0.25) / 0.65) : b(14) ? -1 : b(15) ? 1 : 0);
      const a = b(0); if (a && !wasA) links[sel].click(); wasA = a;
    }
    const k = Math.max(innerWidth / PW, innerHeight / PH), ox = (innerWidth - PW * k) / 2, oy = (innerHeight - PH * k) / 2, L = cockpit.lcd();
    Object.assign(lcd.style, { left: `${ox + (L.x + 1) * k}px`, top: `${oy + (L.y + 1) * k}px`, width: `${(L.w - 2) * k}px`, height: `${(L.h - 2) * k}px`, fontSize: `${Math.round(L.h * k / 5.4)}px`, lineHeight: '1.02' });
    requestAnimationFrame(poll);
  };
  requestAnimationFrame(poll);
  window.cockpitMenu = { selected: () => sel, items: () => links.map(a => a.textContent), ava: () => ava.act, avaAt: () => ava.screen, stickers: () => stickers.length, billboard: () => BB.z };
</script>
</body>
</html>
