<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NomadGirl">
<title>NomadGirl – Spiel</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('nomad.theme') || 'gray'; } catch (e) { document.documentElement.dataset.theme = 'gray'; }</script>
<link rel="stylesheet" href="game/ui.css">
<link rel="stylesheet" href="game/play/play.css">
<link rel="stylesheet" href="game/play/loading.css">
<script src="game/vendor/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<div id="load"></div>
<script type="module">
  import { start } from './game/play/main.js';
  import { createLoading } from './game/play/loading.js';
  const loading = createLoading(document.getElementById('load'), new URL('projects/nomadgirl/', location.href));
  start(document.getElementById('game'), document.getElementById('hud'), loading)
    .then(g => { window.game = g; })
    .catch(e => { loading.fail('Fehler beim Laden: ' + e.message); console.error(e); });
</script>
</body>
</html>
