<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NomadGirl">
<title>NomadGirl – Werkstatt 0.1</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('nomad.theme') || 'gray'; } catch (e) { document.documentElement.dataset.theme = 'gray'; }</script>
<link rel="stylesheet" href="game/basis.css">
<link rel="stylesheet" href="game/ui.css">
<link rel="stylesheet" href="game/workshop/workshop.css">
<link rel="stylesheet" href="game/play/loading.css">
</head>
<body class="ng">
<div id="editor" hidden></div>
<div id="load"></div>
<script type="module">
  import { Workshop } from './game/workshop/workshop.js';
  import { createLoading } from './game/play/loading.js';
  const base = new URL('projects/nomadgirl/', location.href);
  const loading = createLoading(document.getElementById('load'), base);   // Spiel › Ladebalken
  const w = new Workshop(document.getElementById('editor'), base);
  window.workshop = w;
  w.start().then(() => { loading.data(); loading.progress(1); loading.done(); }).catch(e => { loading.fail('Fehler beim Laden: ' + e.message); console.error(e); });
</script>
</body>
</html>
