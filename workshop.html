<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NomadGirl">
<title>NomadGirl – Werkstatt 0.1</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('nomad.theme') || 'gray'; } catch (e) { document.documentElement.dataset.theme = 'gray'; }</script>
<link rel="stylesheet" href="game/basis.css">
<link rel="stylesheet" href="game/ui.css">
<link rel="stylesheet" href="game/workshop/workshop.css">
</head>
<body class="ng">
<div id="editor" hidden></div>
<div id="ng-load">Leyla packt den Rucksack …</div>
<script type="module">
  import { Workshop } from './game/workshop/workshop.js';
  const w = new Workshop(document.getElementById('editor'), new URL('projects/nomadgirl/', location.href));
  window.workshop = w;
  w.start().then(() => document.getElementById('ng-load').remove()).catch(e => { document.getElementById('ng-load').textContent = 'Fehler beim Laden: ' + e.message; console.error(e); });
</script>
</body>
</html>
