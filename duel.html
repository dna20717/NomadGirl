<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomadGirl – Glitch-Duell</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('nomad.theme') || 'gray'; } catch (e) { document.documentElement.dataset.theme = 'gray'; }</script>
<link rel="stylesheet" href="game/ui.css">
<style>
  /* Glitch-Duell demo (#050): cards in two rows, the dice tray between them. Only --ui-* tokens plus the duel's own signal colours. */
  :root { --dl-hit: #59c135; --dl-miss: #4a5462; --dl-block: #249fde; --dl-wound: #df3e23; --dl-gold: #ffd541; --dl-cyan: #20d6c7; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 50% 40%, #1c1a28, #0b0a10 70%); color: var(--ui-text); font: 500 14px var(--ui-font); }
  #duel { max-width: 1100px; margin: 0 auto; padding: 12px 16px 60px; box-sizing: border-box; }
  .dl-setup { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; padding: 10px 12px; border: 1px solid var(--ui-border); border-radius: var(--ui-r-pane); background: var(--ui-glass); }
  .dl-setup label { display: grid; gap: 2px; } .dl-setup small { color: var(--ui-text3); }
  .dl-setup select, .dl-setup input[type=number] { height: 32px; border-radius: var(--ui-r-field); border: 1px solid var(--ui-border-strong); background: var(--ui-field); color: var(--ui-text); font: inherit; padding: 0 8px; }
  .dl-setup input[type=number] { width: 7ch; }
  .dl-setup button, .dl-main { height: 32px; padding: 0 12px; border-radius: var(--ui-r-button); border: 1px solid var(--ui-border-strong); background: var(--ui-panel); color: var(--ui-text); font: inherit; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .dl-setup button:hover { background: var(--ui-hover); }
  .dl-check { display: flex !important; grid-auto-flow: column; gap: 6px !important; align-items: center; height: 32px; }
  .dl-title { font: 30px/1 var(--ui-pixel); color: var(--dl-cyan); letter-spacing: .04em; align-self: center; } .dl-sub { color: var(--ui-text3); align-self: center; margin-right: auto; }
  .dl-sim { align-self: center; color: var(--dl-gold); }
  .dl-board { display: grid; gap: 14px; margin-top: 14px; }
  .dl-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; min-height: 270px; align-items: center; }
  .dl-card { position: relative; width: 170px; padding: 10px 10px 12px; border-radius: 12px; background: linear-gradient(#1d1b28, #14121c); border: 2px solid #3a3550; box-shadow: 0 6px 18px rgba(0,0,0,.45);
    display: grid; justify-items: center; gap: 3px; text-align: center; transition: transform .18s, box-shadow .18s, opacity .25s, border-color .18s; user-select: none; }
  .dl-card.enemy { border-color: #5b3138; } .dl-card.player { border-color: #24523b; }
  .dl-card.pick { cursor: pointer; } .dl-card.pick:hover { transform: translateY(-6px); }
  .dl-card.sel { border-color: var(--dl-gold); box-shadow: 0 0 0 3px rgba(255,213,65,.25), 0 10px 26px rgba(0,0,0,.5); transform: translateY(-10px); }
  .dl-card.target { cursor: crosshair; border-color: var(--dl-wound); animation: dl-pulse 1s infinite; } .dl-card.target:hover { transform: translateY(6px) scale(1.03); }
  .dl-card.done { opacity: .6; } .dl-card.out { filter: grayscale(1) brightness(.55); opacity: .7; }
  .dl-card.acting { border-color: var(--dl-cyan); box-shadow: 0 0 22px rgba(32,214,199,.35); }
  .dl-card.hurt { animation: dl-shake .35s 2; }
  .dl-card.flicker .dl-face { animation: dl-flicker .5s steps(2) infinite; }
  @keyframes dl-pulse { 50% { box-shadow: 0 0 22px rgba(223,62,35,.45); } }
  @keyframes dl-shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes dl-flicker { 0% { opacity: 1; transform: translateX(0); } 50% { opacity: .55; transform: translateX(2px); } }
  .dl-face canvas { display: block; image-rendering: pixelated; }
  .dl-name { font: 22px/1 var(--ui-pixel); color: var(--ui-text-strong); letter-spacing: .03em; margin-top: 2px; }
  .dl-maker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; } .dl-kind { font-size: 12px; color: var(--ui-text3); }
  .dl-stats { display: flex; gap: 8px; font: 18px/1 var(--ui-pixel); color: var(--ui-text); margin-top: 3px; } .dl-stats span { display: inline-flex; gap: 2px; align-items: center; } .dl-stats svg { opacity: .7; }
  .dl-pips { display: flex; gap: 3px; margin-top: 4px; } .dl-pips i { width: 12px; height: 8px; border-radius: 2px; background: #3a1a20; } .dl-pips i.on { background: var(--dl-cyan); box-shadow: 0 0 6px rgba(32,214,199,.5); }
  .dl-tag { position: absolute; top: 8px; right: 8px; font: 15px/1 var(--ui-pixel); color: var(--dl-gold); background: rgba(0,0,0,.6); padding: 2px 5px; border-radius: 4px; }
  .dl-stamp { position: absolute; top: 48px; left: 50%; transform: translateX(-50%) rotate(-12deg); font: 24px/1 var(--ui-pixel); color: var(--dl-wound); border: 2px solid var(--dl-wound); padding: 2px 8px; border-radius: 4px; background: rgba(10,8,12,.7); text-transform: uppercase; }
  .dl-float { position: absolute; top: 30px; right: 14px; font: 34px/1 var(--ui-pixel); color: var(--dl-wound); text-shadow: 0 2px 0 #000; animation: dl-up 1.2s ease-out forwards; }
  @keyframes dl-up { from { transform: translateY(10px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-16px); opacity: 0; } }
  .dl-preview { position: absolute; left: 50%; bottom: -46px; transform: translateX(-50%); width: max-content; font-size: 12px; color: var(--ui-tip-text, #fff); background: rgba(0,0,0,.85); padding: 4px 8px; border-radius: 6px; z-index: 2; pointer-events: none; display: none; }
  .dl-card.target:hover .dl-preview { display: block; }
  .dl-mid { display: grid; gap: 10px; justify-items: center; padding: 10px; border-top: 1px dashed #2c2838; border-bottom: 1px dashed #2c2838; }
  .dl-status { display: flex; gap: 12px; align-items: center; font: 22px/1 var(--ui-pixel); color: var(--ui-text-strong); } .dl-round { color: var(--dl-cyan); }
  .dl-status.end.player { color: var(--dl-hit); } .dl-status.end.enemy { color: var(--dl-wound); }
  .dl-main { background: var(--dl-gold); color: #241a00; border-color: #c28d29; font-weight: 700; }
  .dl-tray { display: grid; gap: 4px; min-height: 92px; align-content: center; justify-items: start; } .dl-tray.empty { color: var(--ui-text3); justify-items: center; }
  .dl-line { display: flex; gap: 8px; align-items: center; } .dl-line.head { font-size: 15px; gap: 6px; } .dl-line small { color: var(--ui-text3); min-width: 150px; } .dl-line .red { color: var(--dl-wound); }
  .dl-dice { display: inline-flex; gap: 4px; }
  .dl-die { width: 22px; height: 22px; border-radius: 5px; display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 3px; box-sizing: border-box; animation: dl-roll .35s ease-out; }
  .dl-die i.p { width: 4px; height: 4px; border-radius: 1px; background: #fff; place-self: center; }
  .dl-die.hit { background: var(--dl-hit); } .dl-die.miss { background: var(--dl-miss); } .dl-die.block { background: var(--dl-block); } .dl-die.wound { background: var(--dl-wound); }
  @keyframes dl-roll { from { transform: rotate(-180deg) scale(.4); opacity: 0; } }
  .dl-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .dl-act { min-height: 44px; text-align: left; padding: 0 14px; border-radius: var(--ui-r-button); border: 1px solid var(--ui-border-strong); background: var(--ui-panel); color: var(--ui-text); font: 600 14px var(--ui-font); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .dl-act-text { display: grid; line-height: 1.15; } .dl-act-text small { font-weight: 500; font-size: 11px; opacity: .75; }
  .dl-stats.small { font-size: 16px; margin-top: 0; color: var(--ui-text2); }
  .dl-act:disabled { opacity: .35; cursor: default; } .dl-act.on { background: var(--dl-gold); color: #241a00; border-color: #c28d29; }
  .dl-rules { color: var(--ui-text3); font-size: 12px; max-width: 760px; margin: 18px auto 0; text-align: center; line-height: 1.5; }
  .dl-boot { margin: 40px auto; max-width: 560px; text-align: center; color: var(--ui-text3); font: 22px/1.4 var(--ui-pixel); } .dl-boot.err { color: #f5a097; font: 15px/1.5 var(--ui-font); } .dl-boot code { color: #ffd541; word-break: break-word; }
  /* Bit-Stapel (#051): one AI per side, three pipelines, the bit in a reel; neon on black (AAP-64: cyan #20d6c7, magenta #bc4a9b, amber #ffd541) */
  body:has(.sb-board) { background: #07060c; background-image: linear-gradient(rgba(32,214,199,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(32,214,199,.05) 1px, transparent 1px); background-size: 32px 32px; }
  body:has(.sb-board)::after { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); z-index: 50; }
  .sb-board { --pc: #20d6c7; --ec: #e43b9a; display: grid; gap: 6px; margin: 8px auto 0; justify-items: center; max-width: 640px; font-family: var(--ui-pixel); }
  .sb-ai { width: 100%; display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 14px; align-items: center; padding: 4px 12px; border: 1px solid var(--c); border-radius: 4px; position: relative;
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, #07060c), #07060c 70%); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 25%, transparent), inset 0 0 0 1px rgba(0,0,0,.6); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
  .sb-ai.player { --c: var(--pc); } .sb-ai.enemy { --c: var(--ec); }
  .sb-ai.active { box-shadow: 0 0 28px color-mix(in srgb, var(--c) 55%, transparent); } .sb-ai.hit { animation: dl-shake .3s 2; }
  .sb-portrait canvas { display: block; image-rendering: pixelated; filter: drop-shadow(0 0 6px var(--c)); }
  .sb-id { display: grid; gap: 2px; min-width: 0; } .sb-id b { font: 28px/1 var(--ui-pixel); color: #fff; letter-spacing: .04em; text-shadow: 0 0 8px var(--c); }
  .sb-id small { font: 15px/1.1 var(--ui-pixel); color: #b3b9d1; letter-spacing: .03em; } .sb-tag { color: var(--c) !important; text-transform: uppercase; letter-spacing: .12em !important; }
  .sb-fav { display: inline-flex; gap: 6px; align-items: center; }
  .sb-hp { position: relative; width: 150px; height: 22px; background: #140c16; border: 1px solid var(--c); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .sb-hp i { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, var(--c) 0 8px, transparent 8px 10px); opacity: .85; transition: width .35s; box-shadow: 0 0 10px var(--c); }
  .sb-hp b { position: relative; font: 22px/1 var(--ui-pixel); color: #fff; text-shadow: 0 0 4px #000, 0 1px 0 #000; } .sb-hp small { position: relative; font: 14px/1 var(--ui-pixel); color: #fff; opacity: .7; }
  .sb-delta { position: absolute; right: -4px; top: -20px; font: 24px/1 var(--ui-pixel); animation: dl-up 1.4s ease-out forwards; } .sb-delta.up { color: #59c135; } .sb-delta.down { color: #df3e23; text-shadow: 0 0 8px #df3e23; }
  .sb-firesum { display: inline-flex; align-items: center; gap: 2px; font: 26px/1 var(--ui-pixel); color: #4a5462; } .sb-firesum.on { color: #fa6a0a; text-shadow: 0 0 10px #fa6a0a; }
  .sb-pipes { display: flex; gap: 14px; justify-content: center; }
  .sb-pipe { --c: var(--pc); position: relative; width: 112px; display: grid; gap: 4px; justify-items: center; padding: 6px 6px; cursor: default; user-select: none; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--c) 7%, transparent)), #0b0a12; transition: transform .15s, box-shadow .15s; }
  .sb-pipe.enemy { --c: var(--ec); background: linear-gradient(0deg, transparent, color-mix(in srgb, var(--c) 7%, transparent)), #0b0a12; }
  .sb-pipe::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: repeating-linear-gradient(180deg, var(--c) 0 6px, transparent 6px 14px); opacity: .35; animation: sb-flow 1.2s linear infinite; }
  .sb-pipe.player::before { animation-direction: reverse; } .sb-pipe.firing::before { opacity: .9; box-shadow: 0 0 8px var(--c); animation-duration: .5s; }
  @keyframes sb-flow { to { background-position: 0 14px; } }
  .sb-pipe.pick { cursor: pointer; } .sb-pipe.pick:hover { transform: translateY(-4px); box-shadow: 0 0 0 1px #ffd541, 0 0 22px rgba(255,213,65,.35); }
  .sb-pipe.hit { animation: dl-shake .3s 2; box-shadow: 0 0 22px #df3e23; } .sb-pipe.put { box-shadow: 0 0 18px color-mix(in srgb, var(--c) 60%, transparent); }
  .sb-stack { position: relative; display: grid; gap: 4px; }
  .sb-slot { width: 42px; height: 42px; display: grid; place-items: center; border: 1px dashed color-mix(in srgb, var(--c) 35%, transparent); background: rgba(0,0,0,.4); }
  .sb-value { display: flex; gap: 8px; align-items: center; justify-content: center; min-height: 24px; } .sb-value small { font: 14px/1 var(--ui-pixel); color: var(--c); letter-spacing: .1em; opacity: .8; } .sb-value b { font: 24px/1 var(--ui-pixel); color: #fff; }
  .sb-fire { display: inline-flex; align-items: center; font: 22px/1 var(--ui-pixel); color: #fa6a0a; text-shadow: 0 0 8px #fa6a0a; }
  .sb-gain { display: inline-flex; align-items: center; font: 20px/1 var(--ui-pixel); color: #59c135; }
  .sb-die { width: 36px; height: 36px; display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 6px; box-sizing: border-box; background: #10101a; border: 2px solid var(--c, #20d6c7); border-radius: 3px; box-shadow: 0 0 8px color-mix(in srgb, var(--c, #20d6c7) 40%, transparent), inset 0 0 8px rgba(0,0,0,.6); }
  .sb-die i.p { width: 5px; height: 5px; background: var(--c, #20d6c7); box-shadow: 0 0 4px var(--c, #20d6c7); place-self: center; }
  .sb-die.x2 { --c: #ffd541; } .sb-die.x3 { --c: #fa6a0a; background: #2a1408; }
  .sb-die.fav { position: relative; } .sb-die.fav::after { content: '♥'; position: absolute; right: -7px; top: -9px; font: 13px/1 var(--ui-font); color: #e86a73; text-shadow: 0 0 4px #e86a73; }
  .sb-die.new { animation: sb-drop .28s cubic-bezier(.2,.9,.3,1.3); } @keyframes sb-drop { from { transform: translateY(-26px); opacity: 0; } }
  .sb-die.ghost { opacity: .45; }
  .sb-slot.ghost .sb-die, .sb-gain, .sb-tip { visibility: hidden; } .sb-pipe.pick:hover .sb-slot.ghost .sb-die, .sb-pipe.pick:hover .sb-gain, .sb-pipe.pick:hover .sb-tip { visibility: visible; }
  .sb-board.hover-0 .sb-pipe.enemy[data-col="0"] .sb-die.will, .sb-board.hover-1 .sb-pipe.enemy[data-col="1"] .sb-die.will, .sb-board.hover-2 .sb-pipe.enemy[data-col="2"] .sb-die.will { --c: #df3e23; background: #3b0c10; animation: dl-pulse .7s infinite; }
  .sb-die.mini { width: 18px; height: 18px; padding: 2px; border-width: 1px; } .sb-die.mini i.p { width: 3px; height: 3px; }
  .sb-die.big { width: 56px; height: 56px; padding: 10px; flex: none; } .sb-die.big i.p { width: 8px; height: 8px; }
  .sb-tip { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); width: max-content; font: 15px/1 var(--ui-pixel); background: #000; border: 1px solid #df3e23; color: #fff; padding: 3px 7px; display: inline-flex; gap: 4px; align-items: center; z-index: 3; }
  .sb-mid { display: grid; justify-items: center; gap: 4px; padding: 4px 0; }
  .sb-turn { font: 15px/1 var(--ui-pixel); letter-spacing: .18em; } .sb-turn.player { color: var(--pc); } .sb-turn.enemy { color: var(--ec); }
  .sb-reel { --c: #ffd541; padding: 6px; border: 2px solid #ffd541; background: #000; box-shadow: 0 0 20px rgba(255,213,65,.35), inset 0 0 12px rgba(255,213,65,.2); }
  .sb-reel.enemy { --c: var(--ec); border-color: var(--ec); box-shadow: 0 0 20px color-mix(in srgb, var(--ec) 40%, transparent); } .sb-reel.player { --c: var(--pc); border-color: var(--pc); box-shadow: 0 0 20px color-mix(in srgb, var(--pc) 40%, transparent); }
  .sb-window { width: 56px; height: var(--h); overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
  .sb-strip { display: flex; flex-direction: column; } .sb-strip .sb-die.big { height: var(--h); }
  .sb-strip.spin { transform: translateY(calc(var(--n) * var(--h) * -1)); animation: sb-spin var(--t) cubic-bezier(.12,.75,.25,1) forwards; }
  @keyframes sb-spin { from { transform: translateY(calc(var(--n) * var(--h) * -1)); } 92% { transform: translateY(5px); } to { transform: translateY(0); } }
  .sb-say { text-align: center; color: #b3b9d1; font: 16px/1.2 var(--ui-pixel); letter-spacing: .03em; min-height: 18px; }
  .sb-mid.end { gap: 8px; } .sb-mid.end b { font: 28px/1 var(--ui-pixel); letter-spacing: .06em; } .sb-mid.end.player b { color: var(--pc); text-shadow: 0 0 12px var(--pc); } .sb-mid.end.enemy b { color: var(--ec); text-shadow: 0 0 12px var(--ec); }
  .sb-score { font: 26px/1 var(--ui-pixel); color: #fff; }
  @media (max-width: 640px) { .sb-ai { grid-template-columns: auto 1fr; } .sb-pipes { gap: 6px; } .sb-pipe { width: 30vw; } .sb-slot { width: 42px; height: 42px; } .sb-die { width: 36px; height: 36px; padding: 6px; } .sb-id b { font-size: 22px; } }
  @media (max-width: 640px) { .dl-card { width: 140px; } .dl-line small { min-width: 0; } .dl-row { min-height: 0; } }
</style>

<body>
<div id="duel"><p class="dl-boot">Lade das Glitch-Duell …</p></div>
<script>
  // anything that goes wrong is shown on the page (Daniel, 17.11.2026: „/duel lädt nicht“): a blank page tells nobody anything
  const dlFail = msg => { const d = document.getElementById('duel'); if (d && !window.duelDemo) d.innerHTML = '<div class="dl-boot err"><b>Das Glitch-Duell konnte nicht starten.</b><br><code></code><br><small>Bitte diese Zeile an Ava schicken.</small></div>', d.querySelector('code').textContent = msg; };
  addEventListener('error', e => dlFail(e.message + (e.filename ? ` (${e.filename.split('/').pop()}:${e.lineno})` : '')));
  addEventListener('unhandledrejection', e => dlFail(String(e.reason?.stack || e.reason)));
  setTimeout(() => { if (!window.duelDemo) dlFail('Nach 20 s noch nicht geladen (Netz oder Skript blockiert).'); }, 20000);
</script>
<script type="module">
  // Glitch-Duell demo (#050): own address /duel, not in the game yet. ?foe=wild|hunters&foes=1..3&team=1..3&seed=…&auto&tempo=langsam|normal|schnell
  // loaded with import(): a module that cannot load (404, blocked) rejects here and is shown, a static import would fail silently
  // two modes (Daniel, 17.11.2026): ?mode=stack „Bit-Stapel“ (Knucklebones principle, default), ?mode=fight the older Gefecht (OPR core)
  const switchTo = m => { const u = new URL(location.href); u.searchParams.set('mode', m); location.href = u.href; };
  const fight = new URLSearchParams(location.search).get('mode') === 'fight';
  import(fight ? './game/duel_ui.js' : './game/stack_ui.js').then(m => (fight ? m.startDuel : m.startStack)(document.getElementById('duel'), switchTo)).catch(e => dlFail(String(e?.message || e)));
</script>
</body>
